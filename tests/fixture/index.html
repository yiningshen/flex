<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture</title>
<link rel="stylesheet" href="flex.css"><link rel="stylesheet" href="style.css"></head><body>
<main id="flex" data-direction="launch" data-fps="30" data-bpm="120" data-mood="upbeat" data-hit="12">
  <section class="scene" data-start="0" data-end="4" data-transition="cut">
    <h1 class="t-hero say fx-zoom" style="--dur:4" data-claim="framing">A fixture video.</h1>
  </section>
  <section class="scene" data-start="4" data-end="8" data-transition="slide" data-xfade=".35">
    <i class="ic ic-xl fx-pop" data-ic="check-circle" style="--at:.1"></i>
    <h2 class="t-title say fx-rise" style="--at:.3" data-claim="C1">It renders deterministically.</h2>
  </section>
  <section class="scene" data-start="8" data-end="12" data-transition="fade">
    <p class="t-big say fx-rise" style="--at:.1" data-claim="C1">Every frame is a function of time.</p>
  </section>
  <section class="scene" data-start="12" data-end="16" data-transition="fade">
    <h2 class="t-title say fx-rise" style="--at:.1" data-claim="framing">flex</h2>
  </section>
</main>
<script src="flex.js"></script></body></html>
